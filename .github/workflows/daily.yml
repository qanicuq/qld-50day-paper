name: QLD 50-day paper bot

on:
  schedule:
    # 21:30 UTC weekdays = 5:30 PM New York in summer, 4:30 PM in winter (after the close).
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qld-50day-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python bot.py

      - name: Save paper account
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json trades.csv equity.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Paper account update"
          git push

      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -o /dev/null -H "Title: QLD 50-day bot FAILED" \
            -d "The QLD 50-day paper bot run failed. Check the Actions tab." \
            "https://ntfy.sh/$NTFY_TOPIC"
